# 反代 Django 后端 + 静态文件
server {
    listen 80;
    server_name _;

    client_max_body_size 50m;  # 上传试题资源（音频/图片）

    # 静态文件：collectstatic 产物
    location /static/ {
        alias /var/www/static/;
        expires 7d;
        access_log off;
    }

    # 媒体文件：上传到 media/
    location /media/ {
        alias /app/media/;   # 与 backend 容器共享 volume，这里用软链或把 volume 挂到两处
        # 更稳妥的做法：media 同时挂到 backend 和 nginx，别用 alias 跨容器
    }

    # API 反代
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
