# 生产部署用：后端 + Nginx 反代。
# 注意：MySQL 走外部 RDS（DB_HOST），不在这里起容器。
# media 目录挂宿主机 volume，避免容器重建丢失上传文件。

services:
  backend:
    image: ghcr.io/sjl-2006/art-assessment-back:${IMAGE_TAG:-latest}
    container_name: art-backend
    restart: unless-stopped
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPERATION_LOG_ENABLED: "1"
      # 部署流水线已单独跑过 migrate，跳过容器启动时的重复迁移
      SKIP_MIGRATE: "1"
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "2"
      GUNICORN_TIMEOUT: "120"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "manage.py", "check", "--deploy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - art-net

  # Nginx 反代后端 + 提供静态文件（可选，直接暴露 8000 亦可）
  nginx:
    image: nginx:alpine
    container_name: art-nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      # - "443:443"  # HTTPS 需挂证书
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/var/www/static:ro
    networks:
      - art-net

networks:
  art-net:
    driver: bridge
