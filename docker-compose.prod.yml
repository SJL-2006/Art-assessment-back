# 生产部署：backend + Nginx 反代（外网先走 backend:8000 即可，nginx 可选）
# MySQL 走外部 RDS，media 用 volume 持久化

services:
  backend:
    image: ghcr.io/sjl-2006/art-assessment-back:${IMAGE_TAG:-latest}
    container_name: art-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DB_ENGINE: mysql
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      OPERATION_LOG_ENABLED: "1"
      SKIP_MIGRATE: "1"
      GUNICORN_WORKERS: "4"
      GUNICORN_THREADS: "2"
      GUNICORN_TIMEOUT: "120"
    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - art-net

  # Nginx 反代：等 nginx.conf 调试好再启用
  # nginx:
  #   image: nginx:alpine
  #   container_name: art-nginx
  #   restart: unless-stopped
  #   depends_on:
  #     - backend
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
  #     - ./staticfiles:/var/www/static:ro
  #   networks:
  #     - art-net

networks:
  art-net:
    driver: bridge
