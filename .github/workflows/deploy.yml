name: Auto Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:  # 允许手动触发

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: |
            github.com
            47.108.200.73

      - name: Fix file permissions (Windows LF→CRLF)
        run: |
          sudo apt-get update
          sudo apt-get install -y dos2unix
          find . -name "*.sh" -exec dos2unix {} \;
          chmod +x deploy.sh

      - name: Sync deploy script to server
        run: |
          scp \
            -o StrictHostKeyChecking=no \
            deploy.sh \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/deploy.sh

      - name: Execute deploy on server
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "sudo bash /tmp/deploy.sh"

      - name: Verify
        run: |
          curl -s -w "\nHTTP %{http_code}" http://47.108.200.73/api/schema/ | tail -5
